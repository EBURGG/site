<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile - EBURG</title>
    <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/316217684?s=400&u=2b01b96d2ad1e4f698ff1394e711e619a9a2f029&v=4">
    <link rel="stylesheet" href="style.css">
    <script src="maintenance.js"></script>
    <style>
        body { background-color: #e3e3e3; margin: 0; font-family: Arial, sans-serif; }
        .profile-container { max-width: 960px; margin: 20px auto; padding: 0 10px; }
        .profile-header-card { background: white; border: 1px solid #d6d6d6; padding: 20px; display: flex; gap: 20px; align-items: center; border-radius: 4px; }
        .profile-avatar-box { width: 120px; height: 120px; border-radius: 50%; border: 1px solid #ccc; overflow: hidden; background: #f0f0f0; flex-shrink: 0; }
        .profile-avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        .profile-details { flex-grow: 1; }
        .profile-username { font-size: 28px; font-weight: bold; color: #393b3d; margin: 0 0 5px 0; }
        .profile-status { font-size: 13px; color: #757575; font-style: italic; margin-bottom: 15px; }
        .profile-actions { display: flex; gap: 10px; }
        .btn-add-friend { background: #00a2ff; color: white; border: none; padding: 8px 15px; font-size: 12px; font-weight: bold; border-radius: 3px; cursor: pointer; }
        .btn-add-friend:hover { background: #0082cc; }
        .profile-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px; }
        .profile-section-card { background: white; border: 1px solid #d6d6d6; border-radius: 4px; padding: 15px; margin-bottom: 20px; }
        .profile-section-card h3 { font-size: 16px; margin: 0 0 10px 0; border-bottom: 1px solid #eee; padding-bottom: 8px; color: #393b3d; }
        .blurb-text { font-size: 13px; color: #555; line-height: 1.4; }
        .stat-item { font-size: 12px; margin-bottom: 8px; color: #666; }
        .stat-item strong { color: #333; }
    </style>
</head>
<body>

    <header>
        <a href="/home" class="logo">
            <img src="EBURG-logo.png" alt="EBURG">
        </a>
        <nav class="main-nav">
            <a href="/home">Home</a>
            <a href="/games">Discover</a>
            <a href="/catalog">Catalog</a>
            <a href="#">Develop</a>
        </nav>
        <div class="search-bar">
            <input type="text" placeholder="Search">
        </div>
        <div class="nav-right">
            <a href="#" id="myProfileLink">My Profile</a>
        </div>
    </header>

    <div class="profile-container">
        <div class="profile-header-card">
            <div class="profile-avatar-box">
                <img src="https://avatars.githubusercontent.com/u/316217684?s=400&v=4" alt="Profile Picture">
            </div>
            <div class="profile-details">
                <h1 class="profile-username" id="profileTargetUser">Loading...</h1>
                <div class="profile-status">"Building cool 2017 stuff on EBURG."</div>
                <div class="profile-actions">
                    <button class="btn-add-friend" onclick="alert('Friend request sent!')">Add Friend</button>
                    <button class="btn-add-friend" style="background:#f0f0f0; color:#333; border:1px solid #ccc;">Message</button>
                </div>
            </div>
        </div>

        <div class="profile-grid">
            <div class="left-col">
                <div class="profile-section-card">
                    <h3>About</h3>
                    <div class="blurb-text" id="profileBlurb">
                        Welcome to my EBURG profile!
                    </div>
                </div>

                <div class="profile-section-card">
                    <h3>Creations</h3>
                    <p style="font-size:12px; color:#888;">This user hasn't published any games yet.</p>
                </div>
            </div>

            <div class="right-col">
                <div class="profile-section-card">
                    <h3>Statistics</h3>
                    <div class="stat-item">Join Date: <strong>2026</strong></div>
                    <div class="stat-item">Place Visits: <strong>0</strong></div>
                    <div class="stat-item">Account Status: <strong>Active Member</strong></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Extract the user parameter from URL paths like /users/1/profile or /users/karsonypoo/profile
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        let targetUser = 'Guest';

        if (pathSegments[0] === 'users' && pathSegments[1]) {
            targetUser = decodeURIComponent(pathSegments[1]);
        } else {
            targetUser = localStorage.getItem('eburg_user') || 'Guest';
        }

        document.getElementById('profileTargetUser').innerText = targetUser;
        document.title = `${targetUser}'s Profile - EBURG`;
        document.getElementById('profileBlurb').innerText = `Hello! I am ${targetUser}, welcome to my official EBURG profile page.`;

        // Configure Header "My Profile" Link
        const myUser = localStorage.getItem('eburg_user') || 'Guest';
        document.getElementById('myProfileLink').href = `/users/${myUser}/profile`;
    </script>

</body>
</html>
