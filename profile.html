<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - EBURG</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/maintenance.js"></script>
    <script src="/imgfix.js"></script>
</head>
<body>

    <!-- YOUR CLASSIC HEADER & LAYOUT HERE -->
    <div id="profile-card">
        <h1 id="username-display">Loading...</h1>
        <p id="user-status"></p>
    </div>

    <!-- Hidden 404 Container (Only triggers if user genuinely doesn't exist) -->
    <div id="not-found-view" style="display: none; text-align: center; padding: 50px;">
        <img src="https://raw.githubusercontent.com/EBURGG/site/refs/heads/main/placeholders/notfound.png" style="max-width: 400px; width: 100%;">
        <h2>User Not Found</h2>
        <a href="/home">Return Home</a>
    </div>

    <script>
        async function validateAndLoadProfile() {
            // Extract the user parameter from URL: /users/1/profile -> "1"
            const parts = window.location.pathname.split('/');
            const userIndex = parts.indexOf('users');
            const targetId = userIndex !== -1 ? parts[userIndex + 1] : null;

            if (!targetId) {
                show404();
                return;
            }

            try {
                const res = await fetch(`/api/get-user?id=${encodeURIComponent(targetId)}`);
                
                if (!res.ok) {
                    show404();
                    return;
                }

                const user = await res.json();

                // Update your classic profile elements
                const nameEl = document.getElementById('username-display');
                if (nameEl) nameEl.innerText = user.username;

                const statusEl = document.getElementById('user-status');
                if (statusEl) statusEl.innerText = user.status || '';

                document.title = `${user.username} - Profile`;

            } catch (err) {
                console.error("Profile load error:", err);
            }
        }

        function show404() {
            const card = id => document.getElementById(id);
            if (card('profile-card')) card('profile-card').style.display = 'none';
            if (card('not-found-view')) card('not-found-view').style.display = 'block';
        }

        validateAndLoadProfile();
    </script>
</body>
</html>
