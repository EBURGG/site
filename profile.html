<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile - EBURG</title>
    <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/316217684?s=400&u=2b01b96d2ad1e4f698ff1394e711e619a9a2f029&v=4">
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .avatar-viewport {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 1px solid #ccc;
            overflow: hidden;
            background: #f2f2f2;
        }
        .user-info h2 {
            font-size: 24px;
        }
        .user-status {
            font-style: italic;
            color: #666;
            margin: 5px 0 10px 0;
            font-size: 13px;
        }
        .stats-row {
            display: flex;
            gap: 20px;
            font-size: 12px;
        }
        .stats-row span {
            display: block;
            font-weight: bold;
            color: #00a2ff;
            font-size: 14px;
        }
        .wearing-grid, .badges-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
        }
        .asset-card {
            border: 1px solid #e0e0e0;
            border-radius: 3px;
            padding: 5px;
            text-align: center;
        }
        .asset-card img {
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <img src="EBURG-logo.png" alt="EBURG">
        </a>
        <nav class="main-nav">
            <a href="games.html">Games</a>
            <a href="catalog.html">Catalog</a>
            <a href="#">Develop</a>
            <a href="#">Robux</a>
        </nav>
        <div class="search-bar">
            <input type="text" placeholder="Search">
        </div>
        <div class="nav-right">
            <a href="profile.html">My Profile</a>
        </div>
    </header>

    <div class="container">
        <div class="ad-banner">728x90 Advertisement</div>

        <div class="card profile-header">
            <div class="avatar-viewport">
                <img src="https://via.placeholder.com/110" alt="Avatar">
            </div>
            <div class="user-info">
                <h2>EBURG Admin <span style="font-size:12px; background:#fff; border:1px solid #ccc; padding:2px 4px; border-radius:3px;">OBC</span></h2>
                <div class="user-status">"Welcome to EBURG, the 2017 Revival Platform."</div>
                <div class="stats-row">
                    <div>Friends<span>0</span></div>
                    <div>Followers<span>1M+</span></div>
                    <div>Following<span>0</span></div>
                </div>
            </div>
            <div style="margin-left: auto; display: flex; gap: 5px;">
                <button class="btn-control">Message</button>
                <button class="btn-control">Add Friend</button>
            </div>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 10px;">About</h3>
            <p style="font-size: 12px; line-height: 1.4; color: #555;">
                Welcome to EBURG! Check out the games and catalog items, and stay tuned for the client launcher release!
            </p>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 10px;">Currently Wearing</h3>
            <div class="wearing-grid">
                <div class="asset-card"><img src="https://via.placeholder.com/80" alt="Item"></div>
                <div class="asset-card"><img src="https://via.placeholder.com/80" alt="Item"></div>
                <div class="asset-card"><img src="https://via.placeholder.com/80" alt="Item"></div>
            </div>
        </div>
    </div>
</body>
</html>
